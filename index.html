<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dub Track</title>
<meta name="description" content="Pick a clip, hit record, and watch your voice draw a live waveform over the video.">
<meta name="theme-color" content="#04070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dub Track">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: edge-to-edge black stage holding the video, a floating waveform card
     the actor can drag anywhere, and a control bar that fades away while filming. */
  :root {
    --stage: #000;
    --panel-edge: #1d242e;
    --wave: #4fe3d3;
    --hot: #ff2f45;
    --ink: #e8edf3;
    --ink-dim: #7d8794;
    --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 14px;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }

  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: var(--stage); }
  #vid { width: 100%; height: 100%; max-width: 100%; object-fit: contain; background: #000; display: block; }

  /* ---------- start screen ---------- */
  #start {
    position: absolute; inset: 0; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px;
    padding: 32px max(16px, env(safe-area-inset-right, 0px))
             calc(32px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(120% 90% at 50% 0%, #121820 0%, #04070a 70%);
    text-align: center;
  }
  #start h1 { font-size: clamp(25px, 5vw, 38px); font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  #start p { margin: 0; color: var(--ink-dim); max-width: 36ch; line-height: 1.5; font-size: 14.5px; }
  .preview-wrap {
    width: min(520px, 86vw);
    border: 1px solid var(--panel-edge);
    border-radius: 11px;
    padding: 8px;
    background: #070a0f;
  }
  #pv { display: block; width: 100%; height: auto; border-radius: 4px; }

  .btn {
    font: inherit; font-weight: 600; font-size: 15px;
    border: 1px solid var(--panel-edge); border-radius: 999px;
    background: #141a22; color: var(--ink);
    padding: 13px 26px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px;
  }
  .btn:focus-visible { outline: 2px solid var(--wave); outline-offset: 3px; }
  .btn.primary { background: var(--ink); color: #06090d; border-color: var(--ink); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }

  /* mic status */
  #micState { font-size: 13px; color: var(--ink-dim); min-height: 18px; display: flex; align-items: center; gap: 7px; justify-content: center; }
  #micState b { color: var(--wave); font-weight: 600; }
  #micState .warn { color: #ffb02e; }

  /* sensitivity */
  .sens { display: flex; align-items: center; gap: 12px; width: min(340px, 80vw); }
  .sens label { font-size: 12px; color: var(--ink-dim); letter-spacing: .05em; text-transform: uppercase; flex: none; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; min-width: 0;
    height: 3px; border-radius: 3px; background: #27303b; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--wave); border: none; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--wave); border: none; cursor: pointer;
  }

  /* ---------- waveform card ---------- */
  #card {
    position: absolute;
    width: clamp(240px, 44vw, 520px);
    touch-action: none;
    background: linear-gradient(180deg, #0c1117 0%, #070a0f 100%);
    border: 1px solid var(--panel-edge);
    border-radius: 11px;
    padding: 8px 15px;
    box-shadow: 0 18px 48px rgba(0,0,0,.62);
    cursor: grab;
  }
  #card.dragging { cursor: grabbing; }
  #card::before, #card::after {
    content: ""; position: absolute; top: 9px; bottom: 9px; width: 3px;
    background: repeating-linear-gradient(180deg, var(--hot) 0 5px, transparent 5px 11px);
    opacity: .85; border-radius: 2px;
  }
  #card::before { left: 5px; }
  #card::after  { right: 5px; }

  #cv { display: block; width: 100%; height: auto; border-radius: 3px; }

  .tag {
    position: absolute; top: 11px;
    font-family: var(--mono); font-size: clamp(9px, 1.5vw, 12px); font-weight: 600;
    color: var(--hot); letter-spacing: .06em;
    text-shadow: 0 0 10px rgba(255,47,69,.55);
    pointer-events: none;
  }
  #tagLeft  { left: 19px; display: inline-flex; align-items: center; gap: 5px; }
  #tagRight { right: 19px; font-variant-numeric: tabular-nums; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 8px var(--hot); }
  body.rec .dot { animation: blink 1.1s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: .15; } }

  /* ---------- control bar ---------- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 16px calc(18px + env(safe-area-inset-right, 0px))
             calc(20px + env(safe-area-inset-bottom, 0px))
             calc(18px + env(safe-area-inset-left, 0px));
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.8) 48%);
    transition: opacity .45s ease;
  }
  #bar.hidden { opacity: 0; pointer-events: none; }

  #rec {
    width: 68px; height: 68px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.9); background: transparent;
    display: grid; place-items: center; cursor: pointer; padding: 0; flex: none;
  }
  #rec i { display: block; width: 50px; height: 50px; border-radius: 50%; background: var(--hot); transition: all .18s ease; }
  body.rec #rec i { width: 26px; height: 26px; border-radius: 6px; }

  .icon-btn {
    width: 46px; height: 46px; border-radius: 50%; flex: none;
    border: 1px solid rgba(255,255,255,.16); background: rgba(10,13,18,.72);
    color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .icon-btn svg { width: 21px; height: 21px; }
  .icon-btn.off { opacity: .45; }

  .hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(150px + env(safe-area-inset-bottom, 0px));
    font-size: 12.5px; color: var(--ink-dim);
    background: rgba(6,9,13,.82); padding: 7px 14px; border-radius: 999px;
    transition: opacity .4s ease; pointer-events: none; max-width: 86vw;
  }
  .hint.hidden { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    body.rec .dot { animation: none; }
    #bar, .hint, #rec i { transition: none; }
  }
</style>
</head>
<body>

<div id="stage">
  <video id="vid" playsinline webkit-playsinline muted loop hidden></video>

  <section id="start">
    <h1>Dub over your clip</h1>
    <p>Turn the mic on, check the wave moves when you talk, then pick a video and film your take.</p>

    <div class="preview-wrap"><canvas id="pv" width="1040" height="300" aria-label="Live waveform preview"></canvas></div>

    <div id="micState">Microphone is off — the wave is running on a simulated voice.</div>

    <div class="row">
      <button class="btn" id="micBtn" type="button">Turn on microphone</button>
      <button class="btn primary" id="pick" type="button">Choose video</button>
    </div>

    <div class="sens">
      <label for="sens">Level</label>
      <input id="sens" type="range" min="0.4" max="4" step="0.05" value="1.4" aria-label="Microphone sensitivity">
    </div>

    <input id="file" type="file" accept="video/*" hidden>
  </section>

  <div id="card" hidden>
    <canvas id="cv" width="1040" height="300"></canvas>
    <span class="tag" id="tagLeft"><span class="dot"></span>REC</span>
    <span class="tag" id="tagRight">0.00</span>
  </div>
</div>

<div class="hint hidden" id="hint">Tap the screen to hide the controls</div>

<div id="bar" hidden>
  <div class="sens" id="sensBar">
    <label for="sens2">Level</label>
    <input id="sens2" type="range" min="0.4" max="4" step="0.05" value="1.4" aria-label="Microphone sensitivity">
  </div>
  <div class="row">
    <button class="icon-btn" id="swap" type="button" title="Change video" aria-label="Change video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11l-2.5-2.5M20 17H9l2.5 2.5"/></svg>
    </button>
    <button id="rec" type="button" aria-label="Start recording"><i></i></button>
    <button class="icon-btn off" id="mute" type="button" title="Clip audio" aria-label="Toggle clip audio" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var vid   = document.getElementById("vid");
  var start = document.getElementById("start");
  var card  = document.getElementById("card");
  var cv    = document.getElementById("cv");
  var pv    = document.getElementById("pv");
  var bar   = document.getElementById("bar");
  var hint  = document.getElementById("hint");
  var tagR  = document.getElementById("tagRight");
  var file  = document.getElementById("file");
  var recBtn  = document.getElementById("rec");
  var muteBtn = document.getElementById("mute");
  var micBtn  = document.getElementById("micBtn");
  var micState = document.getElementById("micState");
  var sensA = document.getElementById("sens");
  var sensB = document.getElementById("sens2");

  var sens = parseFloat(sensA.value);

  /* ---- microphone --------------------------------------------------------- */
  var mic = { ctx: null, analyser: null, buf: null, stream: null, on: false };

  function secure() {
    return window.isSecureContext ||
           location.protocol === "https:" ||
           location.hostname === "localhost" ||
           location.hostname === "127.0.0.1";
  }

  function setMicState(html) { micState.innerHTML = html; }

  function enableMic() {
    if (mic.on) return;
    if (!secure()) {
      setMicState('<span class="warn">This page needs to be on https:// for the microphone to work.</span>');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMicState('<span class="warn">This browser will not give a page microphone access.</span>');
      return;
    }
    micBtn.disabled = true;
    micBtn.textContent = "Asking…";

    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false
    }).then(function (stream) {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      var src = ctx.createMediaStreamSource(stream);
      var an  = ctx.createAnalyser();
      an.fftSize = 1024;
      an.smoothingTimeConstant = 0.12;
      src.connect(an);
      mic = { ctx: ctx, analyser: an, buf: new Uint8Array(an.fftSize), stream: stream, on: true };
      if (ctx.state === "suspended") ctx.resume();

      micBtn.hidden = true;
      setMicState('Microphone is <b>live</b> — talk and the wave should move.');
    }).catch(function (err) {
      micBtn.disabled = false;
      micBtn.textContent = "Turn on microphone";
      var denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
      setMicState(denied
        ? '<span class="warn">Microphone blocked. Allow it in Settings › Safari, then reload.</span>'
        : '<span class="warn">No microphone available — running on a simulated voice.</span>');
    });
  }

  micBtn.addEventListener("click", enableMic);

  function micLevel() {
    if (!mic.on) return null;
    mic.analyser.getByteTimeDomainData(mic.buf);
    var sum = 0, n = mic.buf.length;
    for (var i = 0; i < n; i++) {
      var v = (mic.buf[i] - 128) / 128;
      sum += v * v;
    }
    var rms = Math.sqrt(sum / n);
    if (rms < 0.006) return 0.012;                 // gate: flat line in the gaps
    return Math.min(1, Math.pow(rms * sens * 5.2, 0.72));
  }

  /* ---- fallback: speech-shaped envelope ----------------------------------- */
  function Voice() { this.level = 0; this.target = 0; this.left = 0; this.phrase = 0; }
  Voice.prototype.next = function () {
    var r = Math.random();
    if (this.phrase <= 0) {
      this.target = 0.015; this.left = 0.34 + Math.random() * 0.5;
      this.phrase = 4 + Math.floor(Math.random() * 7);
    } else if (r < 0.28) {
      this.target = 0.04 + Math.random() * 0.05; this.left = 0.05 + Math.random() * 0.12;
      this.phrase -= 1;
    } else {
      this.target = 0.34 + Math.random() * 0.58; this.left = 0.08 + Math.random() * 0.13;
      this.phrase -= 1;
    }
  };
  Voice.prototype.sample = function (dt, gain) {
    this.left -= dt;
    if (this.left <= 0) this.next();
    this.level += (this.target - this.level) * (this.target > this.level ? 0.34 : 0.10);
    return Math.min(1, this.level * (0.55 + 0.45 * Math.random()) * gain);
  };

  /* ---- rolling buffer + renderer ------------------------------------------ */
  var SLOT = 2.6;
  function Track(canvas) {
    this.c = canvas;
    this.ctx = canvas.getContext("2d");
    this.n = Math.floor(canvas.width / SLOT);
    this.buf = new Float32Array(this.n);
    this.head = 0;
    this.filled = 0;
    this.voice = new Voice();
  }
  Track.prototype.push = function (v) {
    this.buf[this.head] = v;
    this.head = (this.head + 1) % this.n;
    if (this.filled < this.n) this.filled++;
  };
  Track.prototype.at = function (i) {
    if (this.filled < this.n) return i < this.filled ? this.buf[i] : -1;
    return this.buf[(this.head + i) % this.n];
  };
  Track.prototype.reset = function () { this.head = 0; this.filled = 0; this.buf.fill(0); };
  Track.prototype.draw = function (live) {
    var x = this.ctx, w = this.c.width, h = this.c.height, mid = h / 2;

    var bg = x.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#0c1218");
    bg.addColorStop(1, "#05080c");
    x.fillStyle = bg;
    x.fillRect(0, 0, w, h);

    x.strokeStyle = "rgba(255,255,255,.05)";
    x.lineWidth = 1;
    for (var g = 0; g <= w; g += Math.round(w / 12)) {
      x.beginPath(); x.moveTo(g + .5, 0); x.lineTo(g + .5, h); x.stroke();
    }
    x.strokeStyle = "rgba(255,255,255,.09)";
    x.beginPath(); x.moveTo(0, mid + .5); x.lineTo(w, mid + .5); x.stroke();

    var end = this.filled < this.n ? this.filled : this.n;
    var span = h * 0.42;

    x.beginPath();
    x.moveTo(0, mid);
    for (var i = 0; i < end; i++) x.lineTo(i * SLOT, mid - this.at(i) * span);
    for (var j = end - 1; j >= 0; j--) x.lineTo(j * SLOT, mid + this.at(j) * span);
    x.closePath();
    x.fillStyle = "rgba(79,227,211,.18)";
    x.fill();

    x.lineWidth = 1.6;
    x.lineCap = "round";
    for (var k = 0; k < end; k++) {
      var a = this.at(k);
      if (a < 0) continue;
      var px = k * SLOT + 0.8;
      var hh = Math.max(1.2, a * span);
      x.strokeStyle = (end - k) / end > 0.86
        ? "rgba(140,255,243," + (0.55 + a * 0.45) + ")"
        : "rgba(79,227,211," + (0.34 + a * 0.5) + ")";
      x.beginPath(); x.moveTo(px, mid - hh); x.lineTo(px, mid + hh); x.stroke();
    }

    var ph = Math.min(w - 1, end * SLOT);
    x.save();
    x.shadowColor = "rgba(230,255,252,.9)";
    x.shadowBlur = live ? 14 : 5;
    x.strokeStyle = live ? "#eafffb" : "rgba(234,255,251,.45)";
    x.lineWidth = 2;
    x.beginPath(); x.moveTo(ph, 6); x.lineTo(ph, h - 6); x.stroke();
    x.restore();
  };

  var main = new Track(cv);
  var demo = new Track(pv);

  /* ---- loop --------------------------------------------------------------- */
  var recording = false, t0 = 0, last = 0;

  function frame(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;

    var filming = start.hidden;
    var track = filming ? main : demo;
    var live  = filming ? recording : true;

    var lvl = micLevel();
    if (lvl === null) {
      lvl = track.voice.sample(dt, filming ? (recording ? 0.82 : 0.14) : 0.8);
    } else if (filming && !recording) {
      lvl *= 0.3;
    }
    track.push(lvl);
    track.draw(live);

    if (filming && recording) tagR.textContent = ((now - t0) / 1000).toFixed(2);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---- sensitivity -------------------------------------------------------- */
  function syncSens(v) {
    sens = parseFloat(v);
    sensA.value = v;
    sensB.value = v;
  }
  sensA.addEventListener("input", function () { syncSens(this.value); });
  sensB.addEventListener("input", function (e) { e.stopPropagation(); syncSens(this.value); });
  sensB.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

  /* ---- screen wake lock --------------------------------------------------- */
  var wake = null;
  function keepAwake() {
    if (!navigator.wakeLock) return;
    navigator.wakeLock.request("screen").then(function (w) { wake = w; }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (mic.ctx && mic.ctx.state === "suspended") mic.ctx.resume();
    if (!wake) keepAwake();
  });

  /* ---- video pick --------------------------------------------------------- */
  document.getElementById("pick").addEventListener("click", function () { file.click(); });
  document.getElementById("swap").addEventListener("click", function (e) {
    e.stopPropagation();
    file.click();
  });

  file.addEventListener("change", function () {
    var f = file.files && file.files[0];
    if (!f) return;
    if (vid.src) URL.revokeObjectURL(vid.src);
    vid.src = URL.createObjectURL(f);
    vid.hidden = false;
    start.hidden = true;
    card.hidden = false;
    bar.hidden = false;
    main.reset();
    placeCard();
    keepAwake();
    if (mic.ctx && mic.ctx.state === "suspended") mic.ctx.resume();
    vid.play().catch(function () {});
    hint.textContent = mic.on
      ? "Tap the screen to hide the controls"
      : "Mic is off — the wave is simulated. Go back and turn it on for your real voice.";
    hint.classList.remove("hidden");
    setTimeout(function () { hint.classList.add("hidden"); }, 5000);
  });

  function placeCard() {
    if (card.dataset.moved) return;
    var r = card.getBoundingClientRect();
    card.style.left = Math.round((window.innerWidth - r.width) / 2) + "px";
    card.style.top  = Math.round(window.innerHeight * 0.56) + "px";
  }
  window.addEventListener("resize", function () { if (!card.hidden) placeCard(); });

  /* ---- record ------------------------------------------------------------- */
  recBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    recording = !recording;
    document.body.classList.toggle("rec", recording);
    recBtn.setAttribute("aria-label", recording ? "Stop recording" : "Start recording");
    if (recording) {
      t0 = performance.now();
      main.reset();
      if (mic.ctx && mic.ctx.state === "suspended") mic.ctx.resume();
      try { vid.currentTime = 0; } catch (err) {}
      vid.play().catch(function () {});
      setTimeout(function () { if (recording) bar.classList.add("hidden"); }, 2200);
    } else {
      bar.classList.remove("hidden");
      tagR.textContent = "0.00";
    }
  });

  muteBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    vid.muted = !vid.muted;
    muteBtn.setAttribute("aria-pressed", String(vid.muted));
    muteBtn.classList.toggle("off", vid.muted);
  });

  /* ---- tap toggles the chrome --------------------------------------------- */
  window.addEventListener("pointerup", function (e) {
    if (!start.hidden || dragging) return;
    if (e.target.closest("#card") || e.target.closest("#bar")) return;
    bar.classList.toggle("hidden");
  });

  /* ---- drag the card ------------------------------------------------------ */
  var dragging = false, ox = 0, oy = 0;
  card.addEventListener("pointerdown", function (e) {
    dragging = true;
    card.classList.add("dragging");
    try { card.setPointerCapture(e.pointerId); } catch (err) {}
    var r = card.getBoundingClientRect();
    ox = e.clientX - r.left;
    oy = e.clientY - r.top;
    e.preventDefault();
  });
  card.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var r = card.getBoundingClientRect();
    card.style.left = Math.max(0, Math.min(window.innerWidth  - r.width,  e.clientX - ox)) + "px";
    card.style.top  = Math.max(0, Math.min(window.innerHeight - r.height, e.clientY - oy)) + "px";
    card.dataset.moved = "1";
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    card.classList.remove("dragging");
    try { card.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);
})();
</script>
</body>
</html>
